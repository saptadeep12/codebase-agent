<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Doc Chat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #0f0f0f; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; max-width: 860px; margin: 0 auto; padding: 24px; }

    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-shrink: 0; }
    h1 { color: #7c6af7; font-size: 20px; }
    .nav-link { color: #555; font-size: 12px; text-decoration: none; border: 1px solid #333; border-radius: 4px; padding: 4px 10px; }
    .nav-link:hover { color: #7c6af7; border-color: #7c6af7; }

    #upload-zone {
      border: 1px dashed #333;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 12px;
    }
    #upload-zone:hover, #upload-zone.drag-over { border-color: #7c6af7; background: #12101f; }
    #upload-zone.has-file { border-style: solid; border-color: #3a3560; background: #12101f; }
    #upload-zone p { color: #555; font-size: 13px; }
    #upload-zone .file-name { color: #7c6af7; font-size: 13px; margin-top: 4px; }
    #upload-zone .hint { color: #444; font-size: 11px; margin-top: 4px; }
    #file-input { display: none; }

    #status-bar {
      display: none;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      font-size: 12px;
      flex-shrink: 0;
    }
    #status-bar.visible { display: flex; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #98c379; flex-shrink: 0; }
    .status-dot.loading { background: #f7a26a; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
    #status-text { color: #aaa; flex: 1; }
    #clear-btn { color: #555; font-size: 11px; cursor: pointer; border: none; background: none; font-family: monospace; }
    #clear-btn:hover { color: #f48771; }

    #output { flex: 1; overflow-y: auto; padding: 4px 0; }
    .question-line { color: #7c6af7; margin-top: 20px; margin-bottom: 6px; font-size: 13px; }
    .divider { border-top: 1px solid #1a1a1a; margin: 8px 0; }
    .done-line { color: #333; font-size: 11px; margin-top: 8px; display: block; }
    .error { color: #f48771; font-size: 13px; }

    .answer { font-size: 13px; line-height: 1.8; color: #c8e6c9; margin-top: 6px; }
    .answer p { margin-bottom: 10px; }
    .answer h1, .answer h2, .answer h3 { color: #7c6af7; margin: 14px 0 6px; font-size: 14px; }
    .answer strong { color: #fff; }
    .answer em { color: #aaa; }
    .answer code { background: #1e1e1e; border: 1px solid #333; border-radius: 3px; padding: 1px 5px; font-size: 12px; color: #f7a26a; }
    .answer pre { background: #1e1e1e; border: 1px solid #333; border-radius: 6px; padding: 12px; overflow-x: auto; margin: 8px 0; }
    .answer pre code { background: none; border: none; padding: 0; color: #c8e6c9; font-size: 12px; }
    .answer ul, .answer ol { margin: 6px 0 10px 20px; }
    .answer li { margin-bottom: 4px; }
    .answer table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 12px; }
    .answer th { background: #1e1e2e; color: #7c6af7; padding: 6px 10px; border: 1px solid #333; text-align: left; }
    .answer td { padding: 6px 10px; border: 1px solid #222; }
    .answer a { color: #7c6af7; text-decoration: none; }

    /* ── Thinking loader ── */
    .thinking-loader { display: flex; gap: 5px; align-items: center; padding: 14px 0 4px; }
    .thinking-loader .dot {
      width: 7px; height: 7px; border-radius: 50%; background: #7c6af7;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .thinking-loader .dot:nth-child(2) { animation-delay: 0.15s; }
    .thinking-loader .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    .input-bar { display: flex; gap: 8px; margin-top: 12px; flex-shrink: 0; }
    .input-bar input {
      flex: 1; padding: 10px 14px; background: #1e1e1e; border: 1px solid #333;
      color: #fff; border-radius: 6px; font-family: monospace; font-size: 14px;
    }
    .input-bar input::placeholder { color: #555; }
    .input-bar input:focus { outline: none; border-color: #7c6af7; }
    .input-bar input:disabled { opacity: 0.4; cursor: not-allowed; }
    .input-bar button {
      padding: 10px 20px; background: #7c6af7; color: white; border: none;
      border-radius: 6px; cursor: pointer; font-size: 14px; font-family: monospace;
    }
    .input-bar button:hover { background: #6a59e0; }
    .input-bar button:disabled { background: #444; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="header">
    <h1>📄 Doc Chat</h1>
    <a class="nav-link" href="/">← Home</a>
  </div>

  <div id="upload-zone" onclick="document.getElementById('file-input').click()"
       ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
    <p>Drop a PDF here or click to upload</p>
    <div class="file-name" id="file-label"></div>
    <div class="hint" id="upload-hint">Supports PDF files</div>
  </div>
  <input type="file" id="file-input" accept=".pdf" onchange="onFileSelected(event)" />

  <div id="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Ready</span>
    <button id="clear-btn" onclick="clearSession()">✕ clear</button>
  </div>

  <div id="output"></div>

  <div class="input-bar">
    <input id="question" placeholder="Upload a PDF to start asking questions..." disabled />
    <button id="askBtn" onclick="ask()" disabled>Ask</button>
  </div>

  <script src="/static/doc.js"></script>
</body>
</html>
