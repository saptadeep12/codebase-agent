<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Codebase Agent</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #0f0f0f; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; max-width: 860px; margin: 0 auto; padding: 24px; }

    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-shrink: 0; }
    h1 { color: #7c6af7; font-size: 20px; }
    .doc-btn { padding: 7px 16px; background: transparent; color: #7c6af7; border: 1px solid #7c6af7; border-radius: 6px; cursor: pointer; font-family: monospace; font-size: 13px; text-decoration: none; transition: background 0.2s; }
    .doc-btn:hover { background: #7c6af722; }

    .repo-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-shrink: 0; }
    .repo-bar input { flex: 1; padding: 8px 12px; background: #1e1e1e; border: 1px solid #333; color: #fff; border-radius: 6px; font-family: monospace; font-size: 13px; }
    .repo-bar input::placeholder { color: #555; }
    .repo-label { color: #555; font-size: 12px; align-self: center; white-space: nowrap; }

    #output { flex: 1; overflow-y: auto; padding: 12px 0; }

    .question-line { color: #7c6af7; margin-top: 20px; margin-bottom: 8px; font-size: 13px; }
    .divider { border-top: 1px solid #222; margin: 8px 0; }

    .tool-badge { display: inline-block; background: #1e1e2e; border: 1px solid #444; border-radius: 4px; padding: 2px 8px; color: #f7a26a; font-size: 11px; margin: 2px 0; }
    .tool-done { color: #98c379; }
    .tool-input { color: #555; font-size: 10px; margin-left: 6px; }
    .error { color: #f48771; font-size: 13px; }
    .done-line { color: #444; font-size: 11px; margin-top: 8px; display: block; }

    .answer { font-size: 13px; line-height: 1.8; color: #c8e6c9; margin-top: 6px; }
    .answer p { margin-bottom: 10px; }
    .answer h1, .answer h2, .answer h3 { color: #7c6af7; margin: 14px 0 6px; font-size: 14px; }
    .answer strong { color: #fff; }
    .answer em { color: #aaa; }
    .answer code { background: #1e1e1e; border: 1px solid #333; border-radius: 3px; padding: 1px 5px; font-size: 12px; color: #f7a26a; }
    .answer pre { background: #1e1e1e; border: 1px solid #333; border-radius: 6px; padding: 12px; overflow-x: auto; margin: 8px 0; }
    .answer pre code { background: none; border: none; padding: 0; color: #c8e6c9; font-size: 12px; }
    .answer table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 12px; }
    .answer th { background: #1e1e2e; color: #7c6af7; padding: 6px 10px; border: 1px solid #333; text-align: left; }
    .answer td { padding: 6px 10px; border: 1px solid #222; color: #e0e0e0; }
    .answer ul, .answer ol { margin: 6px 0 10px 20px; }
    .answer li { margin-bottom: 4px; }
    .answer a { color: #7c6af7; text-decoration: none; }

    .thinking-loader { display: flex; gap: 5px; align-items: center; padding: 14px 0 4px; }
    .thinking-loader .dot {
      width: 7px; height: 7px; border-radius: 50%; background: #7c6af7;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .thinking-loader .dot:nth-child(2) { animation-delay: 0.15s; }
    .thinking-loader .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    .input-bar { display: flex; gap: 8px; margin-top: 12px; flex-shrink: 0; }
    .input-bar input { flex: 1; padding: 10px 14px; background: #1e1e1e; border: 1px solid #333; color: #fff; border-radius: 6px; font-family: monospace; font-size: 14px; }
    .input-bar input::placeholder { color: #555; }
    .input-bar input:focus { outline: none; border-color: #7c6af7; }
    .input-bar button { padding: 10px 20px; background: #7c6af7; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .input-bar button:hover { background: #6a59e0; }
    .input-bar button:disabled { background: #444; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔍 Codebase Agent</h1>
    <div style="display:flex;gap:8px;align-items:center;">
      <a href="/" class="doc-btn" style="border-color:#333;color:#555;">← Home</a>
      <a href="/doc" class="doc-btn">📄 Doc Chat →</a>
    </div>
  </div>

  <div class="repo-bar">
    <span class="repo-label">Repo:</span>
    <input id="repo" placeholder="owner/reponame — e.g. fastapi/fastapi" />
  </div>

  <div id="output"></div>

  <div class="input-bar">
    <input id="question" placeholder="Ask anything about the repo..." />
    <button id="askBtn" onclick="ask()">Ask</button>
  </div>

  <script src="/static/index.js"></script>
</body>
</html>
