<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codebase Agent</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css"/>
</head>
<body>
    <img class="image-gradient" src="gradient.png" alt="gradient">
    <div class="layer-blur"></div>

    <div class="container">
        <header>
            <h1 data-aos="fade-down" data-aos-duration="1500" class="logo">CODEBASE</h1>

            <nav>
                <a data-aos="fade-down" data-aos-duration="2000" href="/agent">CODEBASE</a>
                <a data-aos="fade-down" data-aos-duration="2500" href="/doc">SCRIBE</a>
            </nav>
            <button data-aos="fade-down" data-aos-duration="1500" class="btn-signing" onclick="window.open('https://github.com/saptadeep12', '_blank')">GITHUB</button>
        </header>
        <main>
            <div class="content">
                <div class="tag-box">
                    <div class="tag">AI DEVELOPER TOOLS &wedbar;</div>
                </div>
                <h1>Ask anything<br>about code</h1>
                <p class="description">Query any public GitHub repository or chat with your PDF documents using natural language. Powered by LangGraph agents and Groq LLM with real-time streaming.</p>

                <div class="buttons">
                    <a href="https://github.com/saptadeep12/codebase-agent#readme" target="_blank" class="btn-get-started">Documentation &gt;</a>
                </div>
            </div>
        </main>
        <spline-viewer class="robot-3d" events-target="local" url="https://prod.spline.design/RRmCoyNRatOe4oT6/scene.splinecode"></spline-viewer>
    </div>

    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.98/build/spline-viewer.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>
</html>
